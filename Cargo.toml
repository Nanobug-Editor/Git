[package]
name = "git-guest"
version = "0.1.49"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Independent consumers receive this SDK through the host's --plugin-cargo cache.
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
